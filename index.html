<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17252f;--muted:#5d6b75;--line:#e1e7ec;--line2:#eef2f5;--bg:#f3f6f8;--card:#fff;--pri:#1f6f78;--pri-d:#15535a;--pri-t:#e3f2f2;
--todo:#6b7a86;--todo-t:#eef1f4;--doing:#2b6cb0;--doing-t:#e5effa;--review:#a86a12;--review-t:#fbf1dd;--done:#23794e;--done-t:#e4f4ea;--cancel:#8a8f94;--cancel-t:#f0f1f2;
--bad:#b42318;--bad-t:#fdecea;--warn:#a86a12;--warn-t:#fbf1dd;--side:#15323d}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.layout{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--side);color:#dbe7ec;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:20px 20px 12px}
.brand .t1{font-size:20px;font-weight:700;color:#fff}.brand .t2{font-size:12.5px;color:#9db6c0}
.deptsel{margin:6px 16px 10px}
.deptsel select{width:100%;height:40px;border-radius:8px;border:1px solid #2c5361;background:#1d4150;color:#fff;padding:0 8px}
.deptname{margin:4px 20px 12px;padding:10px 12px;border-radius:10px;background:#1d4150;font-weight:600;color:#fff;font-size:14px}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px}
.nav .gh{font-size:12px;color:#8aa6b1;padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;color:#dbe7ec;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14.5px}
.nav button:hover{background:#1d4150}
.nav button.on{background:var(--pri);color:#fff;font-weight:600}
.nav .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);border-radius:10px;padding:1px 8px}
.nav .cnt.bad{background:#c0392b}
.me{margin-top:auto;padding:14px 16px;border-top:1px solid #23495a;display:flex;align-items:center;gap:10px}
.me .nm{font-weight:600;color:#fff;font-size:14px}.me .rl{font-size:12px;color:#9db6c0}
.me .avbtn{background:none;border:0;padding:0;cursor:pointer;position:relative;flex:none}.me .avbtn:hover::after{content:'📷';position:absolute;right:-4px;bottom:-4px;font-size:13px}
.me button{background:none;border:0;color:#9db6c0;cursor:pointer;font-size:12.5px;padding:2px 0;text-decoration:underline}
.main{flex:1;min-width:0;padding:22px 28px 48px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:22px}.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #c8d2d9;background:#fff;cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f7f9fa}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}.btn.pri:hover{background:var(--pri-d)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:#efc4bf}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.card-h h2{margin:0;font-size:16px}
.card-b{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{padding:16px 18px;border-top:4px solid var(--c,var(--pri))}
.tile .l{font-size:13.5px;color:var(--muted)}.tile .v{font-size:30px;font-weight:700;line-height:1.2;margin-top:4px}.tile .s{font-size:12.5px;color:var(--muted)}
.tile.clk{cursor:pointer}.tile.clk:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.mu{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.st-todo{background:var(--todo-t);color:var(--todo)}.st-doing{background:var(--doing-t);color:var(--doing)}.st-review{background:var(--review-t);color:var(--review)}.st-done{background:var(--done-t);color:var(--done)}.st-cancel{background:var(--cancel-t);color:var(--cancel)}
.pr-urgent{background:var(--bad-t);color:var(--bad)}.pr-high{background:var(--warn-t);color:var(--warn)}.pr-low{background:var(--line2);color:var(--muted)}
.due-bad{background:var(--bad-t);color:var(--bad)}.due-soon{background:var(--warn-t);color:var(--warn)}.due-ok{background:var(--line2);color:var(--muted)}
.av{object-fit:cover;background:#dfe6ea;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;flex:none}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.bar{height:7px;border-radius:4px;background:var(--line2);overflow:hidden}.bar i{display:block;height:7px;border-radius:4px;background:var(--pri)}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.f{height:40px;padding:0 10px;border:1px solid #c8d2d9;border-radius:8px;background:#fff;font-size:14px;min-width:0}
textarea.f{height:auto;min-height:80px;padding:10px;resize:vertical;width:100%}
.search{flex:1 1 220px}
.seg{display:inline-flex;background:#e6ecef;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);background:#f7f9fa;padding:10px 12px;white-space:nowrap}
table.t td{padding:10px 12px;border-top:1px solid var(--line2);vertical-align:middle}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover td{background:#fafcfc}
table.t td.r,table.t th.r{text-align:right}
.tw{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;overflow-x:auto}
.col{background:#e9eef1;border-radius:12px;padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tcard:hover{border-color:#b9c7cf}
.tcard .tt{font-weight:600;font-size:14px;margin-bottom:4px}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}.feed li:first-child{border-top:0}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:130px}
.chart .bars i{width:10px;border-radius:3px 3px 0 0;display:block}
.chart .lb{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#dlg{position:fixed;inset:0;background:rgba(15,30,38,.45);display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto;z-index:50}
#dlg.show{display:flex}
.dlg{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.dlg .dh{padding:18px 22px 10px}.dlg .dh h2{margin:0;font-size:19px}.dlg .dh .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.dlg .db{padding:6px 22px 14px;display:flex;flex-direction:column;gap:12px}
.dlg .df{padding:14px 22px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.dlg .df .g{flex:1}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted)}
.fld .f{width:100%;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stbtns{display:flex;flex-wrap:wrap;gap:6px}
.stbtns button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.stbtns button.on{font-weight:700;border-color:currentColor}
.secttl{font-weight:700;font-size:14px;margin-top:6px;color:var(--ink)}
.workbox{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.inl{display:flex;gap:8px;align-items:center}.inl .f{flex:1}
.err{background:var(--bad-t);color:var(--bad);padding:10px 12px;border-radius:8px;font-size:14px}
.note{background:var(--pri-t);color:var(--pri-d);padding:10px 12px;border-radius:8px;font-size:13.5px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:calc(100% - 32px)}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#15323d,#1f6f78)}
.gate .box{background:#fff;border-radius:16px;padding:30px 28px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.gate h1{margin:0;font-size:24px}.gate .sub{color:var(--muted);font-size:14px;margin:4px 0 18px}
.gate form{display:flex;flex-direction:column;gap:12px}.gate .f{width:100%;height:46px}
.menu-btn{display:none}
@media (max-width:860px){
  .side{position:fixed;left:-260px;z-index:40;transition:left .2s;height:100vh}
  .side.open{left:0}
  .menu-btn{display:inline-flex}
  .main{padding:16px}
  .board{grid-template-columns:repeat(4,minmax(240px,82vw))}
  .row2,.row3{grid-template-columns:1fr}
}
@media print{.side,.acts,.frow,.menu-btn{display:none!important}.main{padding:0}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app"><div class="gate"><div class="box"><div class="mu">กำลังโหลด…</div></div></div></div>
<div id="dlg"></div>
<div id="toast"></div>
<script>
(function () {
'use strict';
const CF = window.TD_CONFIG || {};
const sb = window.supabase.createClient(CF.SUPABASE_URL, CF.SUPABASE_ANON_KEY);
const DOMAIN = CF.EMAIL_DOMAIN || 'teamdesk.local';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (m, bad) => { const t = $('toast'); t.textContent = m; t.className = bad ? 'show bad' : 'show'; clearTimeout(toast.h); toast.h = setTimeout(() => { t.className = ''; }, 3800); };
const TM = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TMF = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const fd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? (+m[3]) + ' ' + TM[+m[2] - 1] + ' ' + String(+m[1] + 543).slice(2) : ''; };
const fdt = s => { if (!s) return ''; const d = new Date(s); return fd(iso(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const days = s => Math.round((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5);
const ST = { todo: ['รอดำเนินการ', 'st-todo'], doing: ['กำลังทำ', 'st-doing'], review: ['รอตรวจ', 'st-review'], done: ['เสร็จแล้ว', 'st-done'], cancel: ['ยกเลิก', 'st-cancel'] };
const PR = { urgent: ['ด่วนมาก', 'pr-urgent'], high: ['ด่วน', 'pr-high'], normal: ['ปกติ', ''], low: ['ไม่เร่ง', 'pr-low'] };
const PAL = ['#1f6f78', '#b5476b', '#6a4fb3', '#c47a15', '#2b6cb0', '#23794e', '#a33a3a', '#4d6b2f', '#7a4e2d', '#3b5b8c'];
const S = { me: null, dept: null, view: 'dash', d: { divisions: [], depts: [], members: [], cats: [], tasks: [], updates: [] }, f: { q: '', who: '', cat: '', st: 'open' }, stat: { y: new Date().getFullYear(), m: 'all' }, dlg: null };
try { S.dept = localStorage.getItem('td_dept') || null; } catch (e) {}

/* ===================== ข้อมูล ===================== */
const TABLES = { divisions: ['td_divisions', 'sort'], depts: ['td_depts', 'sort'], members: ['td_members', 'sort'], cats: ['td_cats', 'sort'], tasks: ['td_tasks', 'created_at'], updates: ['td_updates', 'created_at'] };
async function load(k) {
  let all = [], from = 0;
  for (;;) { const { data, error } = await sb.from(TABLES[k][0]).select('*').order(TABLES[k][1], { ascending: true }).order('id').range(from, from + 999); if (error) { toast('โหลดข้อมูลไม่สำเร็จ: ' + error.message, true); break; } all = all.concat(data || []); if (!data || data.length < 1000) break; from += 1000; }
  S.d[k] = all;
}
const loadAll = () => Promise.all(Object.keys(TABLES).map(load));
const ROLE_TH = { admin: 'ผู้ดูแลระบบ', office: 'หัวหน้าสำนักงาน', division: 'หัวหน้ากอง', head: 'หัวหน้าแผนก', staff: 'เจ้าหน้าที่' };
const isAdmin = () => S.me && S.me.role === 'admin';
const isTop = () => S.me && (S.me.role === 'admin' || S.me.role === 'office');
const isDiv = () => S.me && S.me.role === 'division';
const isLeader = () => isTop() || isDiv();
const deptBy = id => S.d.depts.find(d => d.id === id) || null;
const divBy = id => S.d.divisions.find(v => v.id === id) || null;
// แผนกที่มองเห็นได้ตามบทบาท
const scopeDepts = () => isTop() ? S.d.depts.slice() : isDiv() ? S.d.depts.filter(d => d.division_id === S.me.division_id) : S.d.depts.filter(d => d.id === S.me.dept_id);
const headOf = id => { const d = deptBy(id); return !!d && (isTop() || (isDiv() && d.division_id === S.me.division_id) || (S.me.role === 'head' && S.me.dept_id === id)); };
const isHead = () => headOf(S.dept);
const orderedDepts = list => { const ord = d => { const v = divBy(d.division_id); return (v ? v.sort : 0) * 1000 + (d.sort || 0); }; return list.slice().sort((a, b) => ord(a) - ord(b)); };
const dept = () => S.d.depts.find(d => d.id === S.dept) || null;
const members = (all) => S.d.members.filter(m => m.dept_id === S.dept && (all || m.active));
const memberBy = id => S.d.members.find(m => m.id === id) || null;
const mColor = m => m ? (m.color || PAL[(Math.abs([...m.id].reduce((a, c) => a * 31 + c.charCodeAt(0), 7)) % PAL.length)]) : '#9aa7b0';
const av = (m, size) => { const z = size || 26, st = 'width:' + z + 'px;height:' + z + 'px;font-size:' + Math.round(z * .45) + 'px'; return m && m.avatar_url ? '<img class="av" src="' + esc(m.avatar_url) + '" alt="" style="' + st + '" loading="lazy">' : '<span class="av" style="background:' + mColor(m) + ';' + st + '">' + esc(m ? m.nickname.slice(0, 1) : '?') + '</span>'; };
const canManage = m => m && (m.id === S.me.id || isAdmin() || (S.me.role === 'office' && m.role !== 'admin') || ((m.role === 'head' || m.role === 'staff') && headOf(m.dept_id)));
const who = m => '<span class="who">' + av(m) + esc(m ? m.nickname : 'ยังไม่มอบหมาย') + '</span>';
const mains = () => S.d.cats.filter(c => c.dept_id === S.dept && !c.parent_id).sort((a, b) => a.sort - b.sort);
const subs = pid => S.d.cats.filter(c => c.parent_id === pid).sort((a, b) => a.sort - b.sort);
const catBy = id => S.d.cats.find(c => c.id === id) || null;
const mainOf = t => { const c = catBy(t.cat_id); return c ? (c.parent_id ? catBy(c.parent_id) : c) : null; };
const catPath = t => { const c = catBy(t.cat_id); if (!c) return ''; const p = c.parent_id ? catBy(c.parent_id) : null; return (p ? p.name + ' › ' : '') + c.name; };
const tasks = () => S.d.tasks.filter(t => t.dept_id === S.dept);
const isOpen = t => t.status !== 'done' && t.status !== 'cancel';
const isOver = t => isOpen(t) && t.due_date && t.due_date < today();
const stPill = s => '<span class="pill ' + ST[s][1] + '">' + ST[s][0] + '</span>';
const prPill = p => p !== 'normal' ? '<span class="pill ' + PR[p][1] + '">' + PR[p][0] + '</span>' : '';
const duePill = t => { if (!t.due_date) return ''; if (!isOpen(t)) return '<span class="pill due-ok">ส่ง ' + fd(t.due_date) + '</span>'; const n = days(t.due_date); return '<span class="pill ' + (n < 0 ? 'due-bad' : n <= 3 ? 'due-soon' : 'due-ok') + '">' + (n < 0 ? 'เกิน ' + (-n) + ' วัน' : n === 0 ? 'ครบวันนี้' : 'ส่ง ' + fd(t.due_date)) + '</span>'; };
const progBar = p => '<div class="bar"><i style="width:' + (p || 0) + '%"></i></div>';
const canEditTask = t => isHead() || t.assignee === S.me.id || t.created_by === S.me.id;

/* ===================== ล็อกอิน ===================== */
async function gate(mode, err) {
  let setup = false; try { const r = await sb.rpc('td_setup_needed'); setup = !!r.data; } catch (e) {}
  if (setup) mode = 'setup';
  $('app').innerHTML = '<div class="gate"><div class="box"><h1>Team Desk</h1><div class="sub">' + esc(CF.ORG_NAME || '') + ' · ระบบมอบหมายและติดตามงาน</div>' + (err ? '<div class="err" style="margin-bottom:12px">' + esc(err) + '</div>' : '') +
    (mode === 'setup' ? '<div class="note" style="margin-bottom:12px">ตั้งค่าครั้งแรก: สร้างบัญชีผู้ดูแลระบบ (สร้างได้ครั้งเดียว)</div><form id="gf"><input class="f" name="u" placeholder="ชื่อผู้ใช้ (a-z, 0-9)" autocomplete="username" required><input class="f" name="n" placeholder="ชื่อที่แสดง" required><input class="f" name="p" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" autocomplete="new-password" required><input class="f" name="p2" type="password" placeholder="ยืนยันรหัสผ่าน" autocomplete="new-password" required><button class="btn pri" style="height:46px">สร้างบัญชีผู้ดูแลระบบ</button></form>'

function filtered() {
  const q = S.f.q.trim().toLowerCase().replace(/\s+/g, '');
  return tasks().filter(t => {
    if (S.f.st === 'open' && !isOpen(t)) return false;
    if (S.f.st === 'over' && !isOver(t)) return false;
    if (ST[S.f.st] && t.status !== S.f.st) return false;
    if (S.f.who === 'none' && t.assignee) return false;
    if (S.f.who && S.f.who !== 'none' && t.assignee !== S.f.who) return false;
    if (S.f.cat) { const c = catBy(t.cat_id); if (!c || (c.id !== S.f.cat && c.parent_id !== S.f.cat)) return false; }
    if (q) { const m = memberBy(t.assignee); if (!(t.title + t.detail + catPath(t) + (m ? m.nickname + m.full_name : '')).toLowerCase().replace(/\s+/g, '').includes(q)) return false; }
    return true;
  });
}

/* ----- รูปโปรไฟล์ (ย่อเป็น 256×256 แล้วอัปโหลดไป Supabase Storage) ----- */
const AV_BUCKET = 'td-avatars';
const avPath = url => { const m = /\/td-avatars\/(.+)$/.exec(String(url || '').split('?')[0]); return m ? decodeURIComponent(m[1]) : null; };
function squareJpeg(file, size) {
  return new Promise((ok, no) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), s = Math.min(img.width, img.height); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size); URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : no(new Error('แปลงรูปไม่ได้')), 'image/jpeg', 0.85); };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('ไฟล์นี้ไม่ใช่รูปภาพ')); }; img.src = u; });
}
function avatar(id) {
  const m = memberBy(id); if (!canManage(m)) return toast('ไม่มีสิทธิ์เปลี่ยนรูปของผู้ใช้นี้', true);
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => { const f = inp.files[0]; if (!f) return; toast('กำลังอัปโหลดรูป…');
    try {
      const blob = await squareJpeg(f, 256), path = m.id + '/' + Date.now() + '.jpg';
      const up = await sb.storage.from(AV_BUCKET).upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000', upsert: false }); if (up.error) throw up.error;
      const url = sb.storage.from(AV_BUCKET).getPublicUrl(path).data.publicUrl;
      const r = await sb.rpc('td_set_avatar', { p_member: m.id, p_url: url }); if (r.error) throw r.error;
      const old = avPath(m.avatar_url); if (old) sb.storage.from(AV_BUCKET).remove([old]);
      await afterAvatar(m.id); toast('เปลี่ยนรูปโปรไฟล์แล้ว');
    } catch (e) { toast('อัปโหลดรูปไม่สำเร็จ: ' + (e.message || e), true); } };
  inp.click();

/* ----- นำเข้าสมาชิกทั้งองค์กรจาก CSV (ผู้ดูแลระบบ) ----- */
const BULK_HD = ['หน่วยงาน', 'บทบาท', 'ชื่อเล่น', 'ชื่อ-นามสกุล', 'ตำแหน่ง', 'ชื่อผู้ใช้', 'รหัสผ่าน'];
const ROLE_IN = { 'หัวหน้าสำนักงาน': 'office', 'หัวหน้ากอง': 'division', 'หัวหน้าแผนก': 'head', 'หัวหน้า': 'head', 'เจ้าหน้าที่': 'staff', 'น้อง': 'staff', 'ทีม': 'staff', office: 'office', division: 'division', head: 'head', staff: 'staff' };
function parseCsv(t) {
  t = t.replace(/^\uFEFF/, ''); const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { r.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; } else f += c; }
  if (f || r.length) { r.push(f); rows.push(r); }
  return rows.filter(x => x.some(v => v.trim()));
}
function bulkTemplate() {
  const office = CF.OFFICE_NAME || 'สำนักงาน', rows = [BULK_HD, [office, 'หัวหน้าสำนักงาน', '', '', '', '', '']];
  S.d.divisions.forEach(v => rows.push([v.name, 'หัวหน้ากอง', '', '', '', '', '']));
  orderedDepts(S.d.depts).forEach(d => { rows.push([d.name, 'หัวหน้าแผนก', '', '', '', '', '']); rows.push([d.name, 'เจ้าหน้าที่', '', '', '', '', '']); rows.push([d.name, 'เจ้าหน้าที่', '', '', '', '', '']); });
  download('แบบฟอร์มนำเข้าสมาชิก_TeamDesk.csv', csv(rows));
}
function bulk() { S.dlg = { type: 'bulk', rows: [] }; drawBulk(); }
function drawBulk(err) {
  const d = S.dlg, ok = d.rows.length && d.rows.every(r => !r.err);
  const tbl = d.rows.length ? '<div class="tw" style="max-height:46vh;overflow:auto"><table class="t"><thead><tr><th>#</th><th>หน่วยงาน</th><th>บทบาท</th><th>ชื่อเล่น</th><th>ชื่อ-นามสกุล</th><th>ชื่อผู้ใช้</th><th>รหัสผ่าน</th><th></th></tr></thead><tbody>' + d.rows.map((r, i) => '<tr' + (r.err ? ' style="background:#fdecec"' : '') + '><td class="mu">' + (i + 1) + '</td><td>' + esc(r.unit) + '</td><td>' + esc(ROLE_TH[r.role] || r.roleRaw) + '</td><td>' + esc(r.nickname) + '</td><td>' + esc(r.full_name) + '</td><td><b>' + esc(r.username) + '</b></td><td><code>' + esc(r.password) + '</code></td><td style="color:var(--bad)">' + esc(r.err || '') + '</td></tr>').join('') + '</tbody></table></div>' +

  dlg('นำเข้าสมาชิก (CSV)', 'สร้างบัญชีหัวหน้าสำนักงาน หัวหน้ากอง หัวหน้าแผนก และเจ้าหน้าที่ ทีเดียวทั้งองค์กร',

    '<label class="btn">เลือกไฟล์ CSV<input type="file" accept=".csv,text/csv" style="display:none" onchange="TD.bulkFile(this.files[0])"></label>' + tbl,
    '<button class="btn" onclick="TD.close()">ยกเลิก</button><button class="btn pri" ' + (ok ? '' : 'disabled ') + 'onclick="TD.bulkSave()">นำเข้า ' + (d.rows.length || '') + ' คน</button>', 960);

async function bulkFile(f) {
  if (!f) return; const rows = parseCsv(await f.text()); if (!rows.length) return drawBulk('ไฟล์ว่าง');
  const h = rows[0].map(x => x.trim()), ix = BULK_HD.map(k => h.indexOf(k)); if (ix[0] < 0 || ix[1] < 0 || ix[2] < 0) return drawBulk('ไม่พบหัวคอลัมน์ ' + BULK_HD.slice(0, 3).join(' / ') + ' — ใช้แบบฟอร์มที่ดาวน์โหลดจากระบบ');
  const g = (r, i) => ix[i] < 0 ? '' : (r[ix[i]] || '').trim(), used = new Set(S.d.members.map(m => m.username)), seen = new Set(), out = [];
  const office = (CF.OFFICE_NAME || 'สำนักงาน').trim();
  rows.slice(1).forEach(r => {
    const x = { unit: g(r, 0), roleRaw: g(r, 1), nickname: g(r, 2), full_name: g(r, 3), position: g(r, 4), username: g(r, 5).toLowerCase(), password: g(r, 6) };
    if (!x.nickname && !x.full_name) return; // แถวที่ไม่ได้กรอกชื่อ = ข้าม
    x.role = ROLE_IN[x.roleRaw] || ''; if (!x.password) x.password = genPw();
    if (!x.username) { let b = 'u' + String(out.length + 1).padStart(3, '0'), k = 1; x.username = b; while (used.has(x.username) || seen.has(x.username)) x.username = b + '_' + (++k); }
    if (!x.role) x.err = 'บทบาทไม่ถูกต้อง';
    else if (!x.nickname) x.err = 'ไม่มีชื่อเล่น';
    else if (x.role === 'division' && !S.d.divisions.some(v => v.name.trim() === x.unit)) x.err = 'ไม่พบกองนี้';
    else if ((x.role === 'head' || x.role === 'staff') && !S.d.depts.some(d => d.name.trim() === x.unit)) x.err = 'ไม่พบแผนกนี้';
    else if (!/^[a-z0-9._-]{2,30}$/.test(x.username)) x.err = 'ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 . _ -';
    else if (used.has(x.username)) x.err = 'ชื่อผู้ใช้มีในระบบแล้ว';
    else if (seen.has(x.username)) x.err = 'ชื่อผู้ใช้ซ้ำในไฟล์';
    else if (x.password.length < 6) x.err = 'รหัสผ่านสั้นกว่า 6 ตัว';
    if (x.role === 'office') x.unit = x.unit || office;
    seen.add(x.username); out.push(x);
  });
  if (!out.length) return drawBulk('ไม่พบแถวที่กรอกชื่อไว้');
  S.dlg.rows = out; drawBulk();
}
async function bulkSave() {
  const rows = S.dlg.rows; if (!rows.length || rows.some(r => r.err)) return;
  const p = rows.map(r => ({ unit: r.unit, role: r.role, username: r.username, nickname: r.nickname, full_name: r.full_name, position: r.position, password: r.password }));
  const { error } = await sb.rpc('td_bulk_members', { p }); if (error) return drawBulk(error.message + ' (ยังไม่ได้สร้างบัญชีใดเลย)');
  closeDlg(); await load('members'); render(true);
  S.sumText = 'Team Desk\n' + (location.origin + location.pathname) + '\n' + rows.map(m => m.nickname + ' · ' + m.unit + ' (' + ROLE_TH[m.role] + ') ชื่อผู้ใช้: ' + m.username + ' รหัสผ่าน: ' + m.password).join('\n');
  S.sumRows = [['หน่วยงาน', 'บทบาท', 'ชื่อเล่น', 'ชื่อ-นามสกุล', 'ชื่อผู้ใช้', 'รหัสผ่านเริ่มต้น']].concat(rows.map(m => [m.unit, ROLE_TH[m.role], m.nickname, m.full_name, m.username, m.password]));
  S.dlg = { type: 'sum' };
  dlg('สร้างบัญชีแล้ว ' + rows.length + ' คน', 'แจ้งชื่อผู้ใช้และรหัสผ่านให้แต่ละคน แล้วให้เปลี่ยนรหัสผ่านเองหลังเข้าระบบครั้งแรก', '<div class="tw" style="max-height:56vh;overflow:auto"><table class="t"><thead><tr><th>หน่วยงาน</th><th>บทบาท</th><th>ชื่อ</th><th>ชื่อผู้ใช้</th><th>รหัสผ่าน</th></tr></thead><tbody>' + rows.map(m => '<tr><td>' + esc(m.unit) + '</td><td>' + ROLE_TH[m.role] + '</td><td>' + esc(m.nickname) + '</td><td><b>' + esc(m.username) + '</b></td><td><code>' + esc(m.password) + '</code></td></tr>').join('') + '</tbody></table></div>',
    '<button class="btn" onclick="window.print()">พิมพ์</button><button class="btn" onclick="TD.sumCsv()">ดาวน์โหลด CSV</button><button class="btn" onclick="TD.copySum()">คัดลอก</button><button class="btn pri" onclick="TD.close()">เสร็จ</button>', 900);
}

/* ----- ส่งออก CSV ----- */
const csv = rows => '﻿' + rows.map(r => r.map(v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
const download = (name, text) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
function expTasks() { const l = sortTasks(filtered()); download('งาน_' + ((dept() || {}).name || '') + '.csv', csv([['ชื่องาน', 'งานหลัก', 'งานย่อย', 'ผู้รับผิดชอบ', 'มอบหมายโดย', 'สถานะ', 'ความสำคัญ', 'ความคืบหน้า%', 'วันเริ่ม', 'กำหนดส่ง', 'วันที่เสร็จ', 'สร้างเมื่อ', 'รายละเอียด']].concat(l.map(t => { const c = catBy(t.cat_id), mc = mainOf(t); return [t.title, mc ? mc.name : '', c && c.parent_id ? c.name : '', (memberBy(t.assignee) || {}).nickname || '', (memberBy(t.created_by) || {}).nickname || '', ST[t.status][0], PR[t.priority][0], t.progress, t.start_date || '', t.due_date || '', t.done_at ? iso(new Date(t.done_at)) : '', iso(new Date(t.created_at)), t.detail]; })))); }
function expStats() { const { all, rowFor, y, m } = statData(); const hd = ['', 'ได้รับงาน', 'เสร็จ', 'ตรงเวลา%', 'ส่งช้า', 'เฉลี่ย(วัน)', 'ค้างตอนนี้', 'เกินกำหนดตอนนี้'], r = (n, x) => [n, x.got, x.done, x.ontime == null ? '' : x.ontime, x.late, x.avg == null ? '' : x.avg, x.openNow, x.overNow];
  download('สถิติ_' + ((dept() || {}).name || '') + '_' + (m === 'all' ? '' : (+m + 1) + '-') + (y + 543) + '.csv', csv([['ผู้รับผิดชอบ'].concat(hd.slice(1))].concat(members(true).map(x => r(x.nickname, rowFor(all.filter(t => t.assignee === x.id))))).concat([r('รวมทั้งแผนก', rowFor(all))], [[]], [['งานหลัก'].concat(hd.slice(1))], mains().map(c => r(c.name, rowFor(all.filter(t => { const mc = mainOf(t); return mc && mc.id === c.id; }))))))); }

/* ===================== ส่งออกให้ปุ่มเรียกใช้ ===================== */
window.TD = {
  go: v => { S.view = v; if (v !== 'list') S.f.st = v === 'board' ? 'all' : 'open'; const s = $('side'); if (s) s.classList.remove('open'); render(); window.scrollTo(0, 0); },
  setDept: id => { S.dept = id; S.f = { q: '', who: '', cat: '', st: 'open' }; if (S.view === 'org' || S.view === 'structure') S.view = 'dash'; render(); },
  filt: o => { Object.assign(S.f, o); if (S.view !== 'list' && S.view !== 'board') S.view = 'list'; render(); },
  clearF: () => { S.f = { q: '', who: '', cat: '', st: S.f.st }; render(); },
  q: v => { S.f.q = v; const pos = $('fq').selectionStart; render(true); const e = $('fq'); if (e) { e.focus(); e.setSelectionRange(pos, pos); } },
  stat: o => { Object.assign(S.stat, o); render(true); },
  newTask, saveNew, openTask, editTask, saveEdit, setStatus, addNote, delTask, close: () => { const d = S.dlg; closeDlg(); if (d && d.type === 'task' && d.editing) openTask(d.id); },
  newMember, saveNewMember, editMember, saveMember, toggleActive, avatar, avatarDel, pwSelf: () => pwDialog(S.me.id, true), pwOther: id => pwDialog(id, false), savePw,
  addCat, renameCat, delCat, saveDept, newDept, saveDeptNew,
  newDivision, renameDiv, moveDept, newLeader, saveLeader, bulk, bulkTemplate, bulkFile, bulkSave, sumCsv: () => download('บัญชีผู้ใช้_TeamDesk.csv', csv(S.sumRows || [])),
  ndAddWork: () => { grabDept(); S.dlg.works.push({ name: '', subs: ['', '', ''] }); drawDept(); }, ndAddSub: i => { grabDept(); S.dlg.works[i].subs.push(''); drawDept(); }, ndAddMember: () => { grabDept(); S.dlg.team.push({}); drawDept(); },
  copySum: () => { (navigator.clipboard ? navigator.clipboard.writeText(S.sumText) : Promise.reject()).then(() => toast('คัดลอกแล้ว')).catch(() => prompt('คัดลอกข้อความนี้', S.sumText)); },
  expTasks, expStats,
  logout: async () => { await sb.auth.signOut(); location.reload(); }
};
// ปุ่มยกเลิกในหน้าแก้ไขงาน → กลับไปหน้ารายละเอียดงาน
const _open = openTask; window.TD.openTask = id => { if (S.dlg) S.dlg.editing = false; _open(id); };

if (!CF.SUPABASE_URL || !CF.SUPABASE_ANON_KEY) { $('app').innerHTML = '<div class="gate"><div class="box"><h1>Team Desk</h1><div class="err">ไม่พบ config.js หรือยังไม่ได้ใส่ SUPABASE_URL / SUPABASE_ANON_KEY</div></div></div>'; return; }
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { S.me = null; gate('login'); } });
start();
})();
</script>
