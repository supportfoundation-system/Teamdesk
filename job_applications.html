  :root{
    --cream:#FAF6EF; --panel:#FFFFFF; --teal:#0F4C75; --teal-2:#1B6FA8;
    --gold:#B98B4E; --gold-soft:#EADFC9; --sage:#E6EFF6; --ink:#20281F;
    --muted:#6B7268; --line:#DFD9C9; --error:#B3261E; --ok:#2E7D4F; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans Thai',sans-serif;}
  h1,h2,h3{font-family:'Noto Serif Thai',serif;}

  header.top{
    background:linear-gradient(180deg,var(--teal) 0%, var(--teal-2) 100%);
    color:#F4EFE3;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  header.top h1{font-size:1.25rem;margin:0;font-weight:600;}
  header.top a.back{color:var(--gold-soft);text-decoration:none;font-size:.85rem;}
  header.top a.back:hover{text-decoration:underline;}

  .wrap{max-width:1200px;margin:0 auto;padding:22px 18px 60px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input,.toolbar select{
    padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.88rem;background:#fff;
  }
  .toolbar input{flex:1;min-width:200px;}
  .stat-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .pill{
    background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.8rem;color:var(--teal);
  }
  .pill b{color:var(--gold);}

  table.list{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
  table.list th{background:var(--sage);color:var(--teal);text-align:left;padding:10px 12px;font-size:.78rem;}
  table.list td{padding:10px 12px;font-size:.87rem;border-top:1px solid var(--line);}
  table.list tr.rowlink{cursor:pointer;}
  table.list tr.rowlink:hover{background:var(--gold-soft);}
  .status-badge{
    padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:700;display:inline-block;
  }
  .status-ใหม่{background:#E3EEFA;color:#1F5FA8;}
  .status-พิจารณา{background:#FDF2DA;color:#8A6414;}
  .status-นัดสัมภาษณ์{background:#EEE3FA;color:#6B3FA0;}
  .status-ผ่าน{background:#E1F2E6;color:var(--ok);}
  .status-ไม่ผ่าน{background:#FBE4E2;color:var(--error);}
  .status-บัญชีสำรอง{background:#FFF3D6;color:#8A6D00;}

  .expiry-tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;margin-left:4px;}
  .expiry-ok{background:var(--sage);color:var(--teal);}
  .expiry-soon{background:#FDE9C8;color:#8A5A00;}
  .expiry-over{background:#FBE4E2;color:var(--error);}

  .reserve-date-box{display:none;flex-direction:column;gap:4px;font-size:.8rem;}
  .reserve-date-box label{color:var(--muted);}
  .reserve-date-box input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;}

  .empty{padding:40px;text-align:center;color:var(--muted);}

  /* detail drawer */
  .overlay{position:fixed;inset:0;background:rgba(22,58,53,.45);display:none;z-index:50;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(560px, 92vw);background:var(--cream);
    box-shadow:-6px 0 24px rgba(0,0,0,.15);z-index:51;display:none;flex-direction:column;
  }
  .drawer.open, .overlay.open{display:flex;}
  .overlay.open{display:block;}
  .drawer-head{
    background:var(--teal);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;
  }
  .drawer-head h2{font-size:1.05rem;margin:0;}
  .drawer-head button{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;}
  .drawer-photo{width:56px;height:56px;border-radius:10px;object-fit:cover;margin-left:auto;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);flex-shrink:0;}
  .drawer-body{padding:18px 20px;overflow-y:auto;flex:1;}
  .drawer-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;}

  .d-section{margin-bottom:18px;}
  .d-section h3{font-size:.85rem;color:var(--teal);margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;}
  .d-section dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:5px 10px;font-size:.85rem;}
  .d-section dt{color:var(--muted);}
  .d-section dd{margin:0;word-break:break-word;}
  table.mini{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:4px;}
  table.mini th{background:var(--sage);padding:5px 7px;text-align:left;}
  table.mini td{padding:5px 7px;border-top:1px solid var(--line);}

  .file-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--sage);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:.8rem;margin:3px 6px 3px 0;text-decoration:none;color:var(--teal);
  }
  .file-chip:hover{background:var(--gold-soft);}

  select#statusSelect{
    padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:.88rem;flex:1;
  }
  button.primary{
    background:var(--teal);color:#fff;border:none;padding:9px 18px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  button.primary:hover{background:var(--teal-2);}
  button.ghost-btn{
    background:#fff;color:var(--teal);border:1px solid var(--line);padding:9px 16px;border-radius:9px;
    font-weight:600;cursor:pointer;font-family:inherit;font-size:.88rem;white-space:nowrap;
  }
  button.ghost-btn:hover{background:var(--sage);}
  #pdfPrintArea{position:fixed;left:-9999px;top:0;width:780px;background:#fff;}

  #guard{
    max-width:420px;margin:80px auto;text-align:center;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:32px;
  }

@media (max-width:640px){
  body{font-size:14px}
  table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
  .card,.container,.wrap{padding:14px!important}
  h1{font-size:19px}
  h2{font-size:17px}
}
</style>
</head>

<div id="mainApp" style="display:none;">

// ป้องกัน XSS: แปลงอักขระพิเศษก่อนแปะข้อมูลจากผู้สมัครลงใน HTML (ข้อมูลมาจากหน้าสาธารณะ apply.html ห้ามเชื่อถือ)
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
// อนุญาตเฉพาะลิงก์ http/https เท่านั้น — กันลิงก์แบบ javascript: หรือ data:
function safeUrl(u){
  const s = String(u || '').trim();
  return /^https?:\/\//i.test(s) ? esc(s) : '#';
}

async function loadApplications(){

}

function applyFilters(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();

  const dp = document.getElementById('deptFilter').value;

    if(q){

    }

  });
}

function renderList(){

function buildExpiryCell(r){
  if(r.status !== 'บัญชีสำรอง' || !r.reserve_expires_at) return '-';
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(r.reserve_expires_at + 'T00:00:00');
  const diffDays = Math.round((exp - today) / 86400000);
  const dateLabel = formatDateThai(r.reserve_expires_at);
  if(diffDays < 0) return `${dateLabel} <span class="expiry-tag expiry-over">หมดอายุแล้ว</span>`;
  if(diffDays <= 30) return `${dateLabel} <span class="expiry-tag expiry-soon">เหลือ ${diffDays} วัน</span>`;
  return `${dateLabel} <span class="expiry-tag expiry-ok">ปกติ</span>`;
}
function formatDateThai(iso){
  const d = new Date(iso);
  const be = d.getFullYear() + 543;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${be}`;
}

function extractDriveFileId(url){
  const m = String(url||'').match(/\/d\/([a-zA-Z0-9_-]+)/) || String(url||'').match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

async function resolvePhotoUrl(row){
  const photo = (row.attachments||{}).profile_photo;
  if(!photo) return null;
  let src = null;
  if(photo.type === 'file' && photo.paths && photo.paths[0]){
    const { data, error } = await sb.storage.from('job-applications').createSignedUrl(photo.paths[0], 3600);
    if(!error) src = data.signedUrl;
  } else if(photo.type === 'link'){
    const driveId = extractDriveFileId(photo.url);
    src = driveId ? `https://drive.google.com/uc?export=view&id=${driveId}` : photo.url;
  }
  return src;
}

async function loadDrawerPhoto(row){
  const img = document.getElementById('drawerPhoto');
  img.style.display = 'none';
  img.removeAttribute('src');
  const src = await resolvePhotoUrl(row);
  if(!src) return;
  img.onerror = () => { img.style.display = 'none'; };
  img.src = src;
  img.style.display = 'block';
}

}

document.getElementById('deleteApplicationBtn').addEventListener('click', async ()=>{
  if(!currentRow) return;
  if(!confirm(`ต้องการลบใบสมัครของ "${currentRow.full_name||'ผู้สมัครนี้'}" ใช่หรือไม่?\nการลบไม่สามารถกู้คืนได้ (รวมถึงไฟล์แนบทั้งหมด)`)) return;

  const btn = document.getElementById('deleteApplicationBtn');
  btn.disabled = true; btn.textContent = 'กำลังลบ...';

  // ลบไฟล์แนบใน storage แบบ best-effort ก่อน (ไม่บล็อกการลบข้อมูลหลักถ้าลบไฟล์ไม่สำเร็จ)
  try{
    const atts = currentRow.attachments || {};
    const allPaths = Object.values(atts).flatMap(a => (a && a.type === 'file' && a.paths) ? a.paths : []);
    if(allPaths.length) await sb.storage.from('job-applications').remove(allPaths);
  }catch(e){ console.warn('ลบไฟล์แนบไม่สำเร็จ (ข้ามไป):', e); }

  const { data: deletedRows, error } = await sb.from('job_applications').delete().eq('id', currentRow.id).select();
  btn.disabled = false; btn.textContent = '🗑️ ลบใบสมัครนี้';
  if(error){ alert('ลบไม่สำเร็จ: ' + error.message); return; }
  if(!deletedRows || deletedRows.length === 0){
    alert('ลบไม่สำเร็จ: ระบบไม่มีสิทธิ์ลบรายการนี้ (ไม่มีแถวถูกลบจริง) กรุณาติดต่อผู้ดูแลระบบให้ตรวจสอบสิทธิ์ฐานข้อมูล');
    return;
  }

  allRows = allRows.filter(r => r.id !== currentRow.id);
  renderStats();
  renderList();
  closeDrawer();
});

document.getElementById('saveStatus').addEventListener('click', async ()=>{
  if(!currentRow) return;
  const newStatus = document.getElementById('statusSelect').value;
  const payload = { status: newStatus };
  if(newStatus === 'บัญชีสำรอง'){
    const listedAt = document.getElementById('reserveDateInput').value || new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});
    // แก้บั๊ก timezone: คำนวณวันหมดอายุล้วนในกรอบ UTC (ไม่ผ่าน local midnight ของไทย) เพื่อไม่ให้วันที่เลื่อนถอยหลัง 1 วัน
    const[ly,lm,ld]=listedAt.split('-').map(Number);
    const expiry = new Date(Date.UTC(ly, lm-1, ld));
    expiry.setUTCFullYear(expiry.getUTCFullYear() + 1);
    payload.reserve_listed_at = listedAt;
    payload.reserve_expires_at = expiry.toISOString().slice(0,10);
  }
  const { error } = await sb.from('job_applications').update(payload).eq('id', currentRow.id);
  if(error){ alert('บันทึกไม่สำเร็จ: ' + error.message); return; }
  Object.assign(currentRow, payload);
  renderStats();
  renderList();
  closeDrawer();
});

/* ============ ดาวน์โหลด PDF ประวัติผู้สมัคร (รายคน) ============ */
document.getElementById('downloadPdfBtn').addEventListener('click', async ()=>{
  if(!currentRow) return;
  const btn = document.getElementById('downloadPdfBtn');
  const originalText = btn.textContent;
  btn.textContent = 'กำลังสร้าง PDF...'; btn.disabled = true;
  try{
    await exportApplicantPDF(currentRow);
  }catch(err){
    console.error(err);
    alert('สร้าง PDF ไม่สำเร็จ: ' + (err.message||err));
  }finally{
    btn.textContent = originalText; btn.disabled = false;
  }

  // รอให้ฟอนต์ Sarabun โหลดเสร็จสมบูรณ์ก่อนถ่ายภาพเป็น PDF เสมอ — กันปัญหาเครื่องที่เน็ตช้ากว่า
  // ตกไปใช้ฟอนต์สำรอง (Arial) ระหว่างถ่ายภาพ ทำให้ตัวอักษรกว้าง/สูงต่างกัน บรรทัดเลื่อนเพี้ยนไประหว่างเครื่อง
  if(document.fonts&&document.fonts.ready){
    await document.fonts.ready;
    await new Promise(res=>setTimeout(res,150));
  }

  const canvas = await html2canvas(printArea, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const mmPerCanvasPx = imgWidth / canvas.width;
  const pageHeightCanvasPx = pageHeight / mmPerCanvasPx;

  // หาขอบเขต (บนสุด/ล่างสุด) ของแต่ละส่วนในหน่วยพิกเซลของ canvas เพื่อเลือกจุดตัดหน้าไม่ให้ผ่ากลางตาราง/ส่วนใดๆ
  const areaRect = printArea.getBoundingClientRect();
  const canvasScaleFactor = canvas.width / areaRect.width;
  const blockEls = printArea.querySelectorAll('.pdf-block');
  const blocks = [...blockEls].map(el => {
    const r = el.getBoundingClientRect();
    return { top: (r.top - areaRect.top) * canvasScaleFactor, bottom: (r.bottom - areaRect.top) * canvasScaleFactor };
  });

  const topPaddingCanvasPx = 36 * canvasScaleFactor;
  const topPaddingMm = topPaddingCanvasPx * mmPerCanvasPx;

  const pageSlices = [];
  let cursor = 0;
  let isFirstPage = true;
  while (cursor < canvas.height - 1) {
    const availableHeightPx = isFirstPage ? pageHeightCanvasPx : (pageHeightCanvasPx - topPaddingCanvasPx);
    let pageEnd = Math.min(cursor + availableHeightPx, canvas.height);
    if (pageEnd < canvas.height) {
      // ถ้าจุดตัดปกติจะผ่ากลางส่วนใดส่วนหนึ่ง ให้ดันจุดตัดถอยไปที่ขอบบนของส่วนนั้นแทน (เว้นที่ว่างท้ายหน้าแทนการตัดกลางตาราง)
      for (const b of blocks) {
        if (b.top < pageEnd && b.bottom > pageEnd && b.top > cursor) {
          pageEnd = b.top;
          break;
        }
      }
    }
    pageSlices.push({ start: cursor, end: pageEnd });
    cursor = pageEnd;
    isFirstPage = false;
  }

  pageSlices.forEach((slice, i) => {
    if (i > 0) pdf.addPage();
    const sliceHeightPx = Math.round(slice.end - slice.start);
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = sliceHeightPx;
    tempCanvas.getContext('2d').drawImage(canvas, 0, slice.start, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
    const sliceData = tempCanvas.toDataURL('image/jpeg', 0.95);
    const yOffset = i === 0 ? 0 : topPaddingMm;
    pdf.addImage(sliceData, 'JPEG', 0, yOffset, imgWidth, sliceHeightPx * mmPerCanvasPx);
  });

  const safeName = (row.full_name || 'applicant').replace(/[^a-zA-Zก-๙0-9]/g, '_');
  pdf.save(`ประวัติผู้สมัคร_${safeName}.pdf`);
  printArea.innerHTML = '';
}

// เลือก "รายการล่าสุด" จากตาราง education/work_experience ให้ถูกต้อง — เดิมใช้ [0] เฉยๆ ซึ่งใช้ได้กับ

// เรียงจากงานเก่าสุดไปงานปัจจุบัน (กดปุ่ม "+ เพิ่มแถว" ต่อท้ายทีละงาน) ทำให้ [0] กลายเป็นงานเก่าสุดแทนที่จะเป็นงานล่าสุด
// แก้ให้เช็คจากเนื้อหาจริงแทนตำแหน่งในอาเรย์: ถ้ามีแถวไหนเขียน "ปัจจุบัน" ในช่องปีสิ้นสุด ถือว่าเป็นรายการล่าสุด
// ถ้าไม่มีให้เทียบปีเริ่มต้น (from) เอาปีมากที่สุด กันปัญหากรอกไม่เรียงลำดับทั้งสองแบบ
function pickLatestEntry(list){
  if(!list||!list.length)return null;
  const current=list.find(e=>/ปัจจุบัน/.test(String(e&&e.to||'')));
  if(current)return current;
  const parseYear=s=>{const m=String(s||'').match(/\d{4}/);return m?parseInt(m[0]):null;};
  let best=null,bestYear=-1;
  list.forEach(e=>{const y=parseYear(e&&e.from);if(y!=null&&y>bestYear){bestYear=y;best=e;}});
  return best||list[list.length-1];
}
